name: Android APK
on:
  push:
    paths-ignore: ['docs/**', 'team/**', '.claude/**', '*.md']
  workflow_dispatch:
permissions:
  contents: write # to publish the APK on the "Latest Android app" release page
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: maxfit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Easy phone download: replace the APK on one fixed release page every build.
      - name: Publish APK to the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk maxfit-debug.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest maxfit-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "MaxFit Android app (latest test build)" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. On your phone: tap maxfit-debug.apk below, then open it to install."
