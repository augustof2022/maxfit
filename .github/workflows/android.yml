name: Android APK
on:
  push:
    paths-ignore: ['docs/**', 'team/**', '.claude/**', '*.md']
  workflow_dispatch:
permissions:
  contents: write # to publish the APK on the "Latest Android app" release page
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Build number = this workflow's run number: it only goes up, so the app can see a newer build.
      - name: Version
        run: |
          echo "MAXFIT_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "MAXFIT_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_BUILD: ${{ github.run_number }}
      - run: npx cap sync android
      # The fixed signing key lives only in GitHub secrets (see docs/SETUP.md). Same key every build =
      # each APK installs over the last one, so in-app updates work.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.MAXFIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/maxfit-release.p12"
            echo "MAXFIT_KEYSTORE_FILE=$RUNNER_TEMP/maxfit-release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret. Building a debug APK; it cannot update over an installed app."
          fi
      - name: Build APK
        env:
          MAXFIT_KEYSTORE_PASSWORD: ${{ secrets.MAXFIT_KEYSTORE_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          if [ -n "$MAXFIT_KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../maxfit.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../maxfit.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: maxfit-apk-build-${{ github.run_number }}
          path: maxfit.apk
      # The update channel: only builds from main (after a merge) are published, and only when signed.
      # The app reads this release's title ("build N") to know if an update exists.
      - name: Publish APK to the "apk-latest" release
        if: github.ref == 'refs/heads/main' && env.MAXFIT_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest maxfit.apk --prerelease --target "$GITHUB_SHA" \
            --title "MaxFit v${MAXFIT_VERSION} build ${MAXFIT_BUILD}" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. In the app: tap Update. First install: tap maxfit.apk below, then open it."
